notify:
  fields:
    message:
      required: true
      example: "The washing machine has finished."
      selector:
        text:
          multiline: true
    title:
      example: "Washing's done"
      selector:
        text:
    icon:
      example: "mdi:washing-machine"
      selector:
        icon:
    camera:
      selector:
        entity:
          domain: camera
    timeout:
      default: 30
      selector:
        number:
          min: 3
          max: 3600
          unit_of_measurement: s
    tag:
      example: "washing"
      selector:
        text:
    thermostat:
      selector:
        device:
          multiple: true
          filter:
            - integration: fledge
            - integration: mqtt
              manufacturer: Google Nest

dismiss:
  fields:
    tag:
      required: true
      example: "washing"
      selector:
        text:
    thermostat:
      selector:
        device:
          multiple: true
          filter:
            - integration: fledge
            - integration: mqtt
              manufacturer: Google Nest

set_schedule:
  fields:
    entity_id:
      required: true
      example: "climate.nest_thermostat"
      selector:
        entity:
          integration: mqtt
          domain: climate
    heating:
      example: '{"mon": [{"time": "06:30", "temp": 21}, {"time": "22:30", "temp": 16}], "tue": []}'
      selector:
        object:
    hot_water:
      example: '{"mon": [{"on": "06:00", "off": "08:00"}], "sat": []}'
      selector:
        object:
call_for_heat:
  target:
    entity:
      integration: fledge
      domain: switch
  fields:
    heat:
      required: true
      selector:
        boolean:
    rooms:
      example: '["Office", "Snug"]'
      selector:
        text:
          multiple: true
