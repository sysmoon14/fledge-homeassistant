name: An idea
description: A card, a notification, an automation hook or anything else you'd like from the integration.
labels: ["enhancement"]
body:
  - type: textarea
    id: idea
    attributes:
      label: What you'd like
      description: What you want to do, and what gets in the way today.
    validations:
      required: true
  - type: textarea
    id: devices
    attributes:
      label: Devices involved
      description: The kinds of Home Assistant entity, if it's about a card (a cover, a vacuum, a climate preset…).
